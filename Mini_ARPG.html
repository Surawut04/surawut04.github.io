let lt=0;
function loop(ts){const d=Math.min(.05,(ts-lt)/1000||0);lt=ts;
 if(state===1&&!over&&!menu&&!inv){if(stop>0)stop-=d;else up(d)}

 else{draw();if(menu)skillUI();if(inv)invUI();if(over)ov('ล้มแล้ว','ฆ่าได้ '+kills+' ตัว · รอด '+Math.floor(time)+' วินาที','แตะเพื่อเล่นใหม่');else if(won&&winT>2.5)ov('ชนะแล้ว!','โค่นบอสได้ · ฆ่า '+kills+' ตัว · Lv '+lv,'แตะเพื่อเล่นใหม่')}

function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}}if(AC&&AC.state==='suspended')AC.resume();
 if(state===0){const [sx,sy]=pos(e),gap=10,cw=Math.min(112,(W-36-gap*2)/3),total=cw*3+gap*2,x0=(W-total)/2,cy=Math.max(105,H*.25),ch=Math.min(260,H*.43),btnY=cy+ch+18;if(sy>=cy&&sy<=cy+ch){for(let i=0;i<3;i++){const x=x0+i*(cw+gap);if(sx>=x&&sx<=x+cw){selectedClass=i;return}}}if(sy>=btnY-8||sy>H*.65){init();state=1;snd(440,.12,'triangle',.1,1.5)}return}if(over){if(overT>.6)init();return}if(won&&winT>2.5){init();return}
 if(inv){const[mx,my]=pos(e);for(const r of ir)if(mx>r.x&&mx<r.x+r.w&&my>r.y&&my<r.y+r.h){reroll(r.k);return}inv=false;return}
 if(menu){const[mx,my]=pos(e);for(const r of mr)if(mx>r.x&&mx<r.x+r.w&&my>r.y&&my<r.y+r.h){if(r.k==='close')menu=false;else if(spt>0&&SK[r.k]<r.m){SK[r.k]++;spt--;snd(600,.1,'triangle',.12,1.5)}}return}
 const[x,y]=pos(e);cv.setPointerCapture(e.pointerId);
 if(x>10&&x<106&&y>64&&y<92){menu=true;return}
 if(x>112&&x<190&&y>64&&y<92){inv=true;return}if(Math.hypot(x-68,y-(H-128))<24){useFlask(0);return}if(Math.hypot(x-128,y-(H-128))<24){useFlask(1);return}
 if(Math.hypot(x-(W-140),y-(H-125))<34){sbtn=true}else if(Math.hypot(x-(W-60),y-(H-170))<38){dbtn=true}else if(Math.hypot(x-(W-150),y-(H-50))<40){spin=true;js.sid=e.pointerId}else if(Math.hypot(x-(W-70),y-(H-90))<70){atk=true;js.aid=e.pointerId}
 else if(x<W*.65&&!js.on){js.on=true;js.id=e.pointerId;js.ox=x;js.oy=y;js.x=0;js.y=0}});
cv.addEventListener('pointermove',e=>{if(js.on&&e.pointerId===js.id){const[x,y]=pos(e);let dx=(x-js.ox)/50,dy=(y-js.oy)/50;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}js.x=dx;js.y=dy}});
const upf=e=>{if(e.pointerId===js.id){js.on=false;js.id=null;js.x=js.y=0}if(e.pointerId===js.aid){atk=false;js.aid=null}if(e.pointerId===js.sid){spin=false;js.sid=null}};
