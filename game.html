<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ป้อมปราการพิทักษ์อาณาจักร</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#f4f1e8;--fg:#2b2a26;--card:#fff;--bd:#cfc8b4;--ac:#b8862b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c19;--fg:#efeadb;--card:#2a2823;--bd:#4a463c;--ac:#e0b050}}
:root[data-theme="dark"]{--bg:#1d1c19;--fg:#efeadb;--card:#2a2823;--bd:#4a463c;--ac:#e0b050}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Press Start 2P","Sarabun","TH Sarabun New",monospace;font-size:12px;text-align:center}
h1{font-size:.8rem;margin:8px 0}
canvas{image-rendering:pixelated;width:100%;max-width:800px;touch-action:manipulation;border:4px solid var(--fg);border-radius:0;display:block;margin:0 auto}
#bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:800px;margin:8px auto;padding:0 6px}
button{font:inherit;padding:10px 12px;border-radius:0;border:3px solid var(--fg);box-shadow:3px 3px 0 var(--fg);background:var(--card);color:var(--fg);cursor:pointer;min-height:44px}
button:disabled{opacity:.4}
#go{background:var(--ac);color:#fff;border-color:var(--ac)}
#msg{font-size:.9rem;min-height:1.4em}
</style></head><body>
<a href="index.html" style="display:inline-block;margin:8px 0 0 8px;font-family:Sarabun,'TH Sarabun New',sans-serif;font-size:14px;color:var(--ac);text-decoration:none;float:left">← กลับหน้าแรก</a>
<h1>🏰 ป้อมปราการพิทักษ์อาณาจักร</h1>
<canvas id="c" width="400" height="240"></canvas>
<div id="bar"><button id="b1"></button><button id="b2"></button><button id="b3"></button><button id="b4"></button></div>
<div id="bar"><button id="go">▶ เริ่มคลื่นถัดไป</button><button id="sp">⏩ x1</button><button id="mu">🔊</button></div>
<div id="msg">แตะวงกลมว่างบนแผนที่เพื่อสร้างป้อม · ป้องกันให้ครบ 10 คลื่น</div>
<div style="font-size:9px;margin:8px;opacity:.7">Art: ElvGames (Free Character Sprites), tower sprites from assets.zip &amp; free Fields Tileset for tower defense</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const P=[[-20,120],[200,120],[200,300],[420,300],[420,140],[620,140],[620,380],[820,380]];
const SL=[[110,200],[290,210],[310,390],[520,220],[520,60],[700,260]];
const TT={
 archer:{n:'ธนู',c:70,r:120,d:8,rt:.6,col:'#3a8a3a'},
 cannon:{n:'ปืนใหญ่',c:100,r:100,d:25,rt:1.6,col:'#555',sp:45},
 mage:{n:'จอมเวทย์',c:120,r:110,d:18,rt:1.1,col:'#8a3ab0',slow:1},
 barracks:{n:'ค่ายทหาร',c:90,r:60,d:0,rt:1,col:'#a0522d'}};
const ET={gob:{hp:40,sp:55,rw:8,col:'#6aa84f',r:9},wolf:{hp:30,sp:95,rw:7,col:'#999',r:8},orc:{hp:130,sp:38,rw:18,col:'#a64d3a',r:13}};
const seg=[];let TOT=0;
for(let i=0;i<P.length-1;i++){const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);seg.push(l);TOT+=l}
function pos(d){for(let i=0;i<seg.length;i++){if(d<=seg[i]){const t=d/seg[i];return[P[i][0]+(P[i+1][0]-P[i][0])*t,P[i][1]+(P[i+1][1]-P[i][1])*t]}d-=seg[i]}return P[P.length-1]}
let H,hSel,gold,lives,wave,E,T,PR,Q,sT,sel,state,spd=1;
function reset(){H={d:520,td:520,hp:150,mx:150,cd:0,dead:0,u:{a:0,h:0,s:0}};hSel=false;gold=160;lives=20;wave=0;E=[];T=[];PR=[];Q=[];sT=0;sel=null;state='play';say('แตะวงกลมสร้างป้อม · แตะฮีโร่เพื่ออัปเกรด/สั่งเดิน')}
function say(s){document.getElementById('msg').textContent=s}
function dmgOf(t){return TT[t.type].d*(1+.6*(t.lvl-1))}
function upCost(t){return Math.round(TT[t.type].c*.8*t.lvl)}
function startWave(){
 if(state!=='play'||Q.length||E.length||wave>=10)return;
 wave++;snd(330,.3,'triangle',.08);const n=5+wave*2;
 for(let i=0;i<n;i++)Q.push(wave>2&&i%4==3?'orc':wave>1&&i%3==2?'wolf':'gob');
 say('คลื่นที่ '+wave+' / 10')}
cv.addEventListener('pointerdown',e=>{
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*480/r.height;
 sel=null;
 const wasH=hSel;hSel=false;
 SL.forEach((s,i)=>{if(Math.hypot(s[0]-x,s[1]-y)<32)sel=i});
 if(sel===null&&state==='play'&&H.dead<=0){const hp=pos(H.d);
  if(Math.hypot(hp[0]-x,hp[1]-y)<30)hSel=true;
  else if(wasH){let b=0,bd=1e9;for(let d=0;d<TOT;d+=6){const q=pos(d),dd=Math.hypot(q[0]-x,q[1]-y);if(dd<bd){bd=dd;b=d}}H.td=b;hSel=true}}
 if(state!=='play')reset()});
function slotTower(i){return T.find(t=>t.s===i)}
function act(k){
 if(state!=='play')return;
 if(sel===null){if(hSel&&H.dead<=0&&k<3){const key=['a','h','s'][k];if(H.u[key]<5&&gold>=hCost(key)){gold-=hCost(key);H.u[key]++;if(key==='h'){H.mx+=40;H.hp+=40}snd(700,.12)}}return}
 const t=slotTower(sel);
 if(!t){const type=['archer','cannon','mage','barracks'][k];
  if(gold>=TT[type].c){gold-=TT[type].c;{const nt={s:sel,x:SL[sel][0],y:SL[sel][1],type,lvl:1,cd:0};
  if(type==='barracks'){let b=0,bd=1e9;for(let d=0;d<TOT;d+=6){const q=pos(d),dd=Math.hypot(q[0]-nt.x,q[1]-nt.y);if(dd<bd){bd=dd;b=d}}nt.rd=b;nt.sol=[-14,14].map(o=>({t:nt,o,hp:110,mx:110,cd:0,dead:0,hit:0}))}
  T.push(nt);snd(520,.12)}}}
 else if(k===0&&t.lvl<3&&gold>=upCost(t)){gold-=upCost(t);t.lvl++;snd(700,.12);if(t.sol)t.sol.forEach(s=>{s.mx+=40;s.hp=s.mx})}
 else if(k===1){gold+=Math.round(TT[t.type].c*.6*t.lvl);T=T.filter(q=>q!==t);sel=null}}
['b1','b2','b3','b4'].forEach((id,k)=>document.getElementById(id).onclick=()=>act(k));
document.getElementById('go').onclick=startWave;
document.getElementById('sp').onclick=e=>{spd=spd===1?2:1;e.target.textContent='⏩ x'+spd};
function hCost(k){return 60+H.u[k]*50}
function ui(){
 const b=[b1,b2,b3,b4];const t=sel===null?null:slotTower(sel);
 b.forEach(x=>{x.style.display='none'});
 if(sel===null&&hSel&&H.dead<=0){[['a','⚔ โจมตี'],['h','❤ พลัง'],['s','⚡ วิ่ง']].forEach((n,i)=>{const l=H.u[n[0]];b[i].style.display='';b[i].textContent=l<5?n[1]+' '+(l+1)+' 🪙'+hCost(n[0]):n[1]+' MAX';b[i].disabled=l>=5||gold<hCost(n[0])})}
 if(sel!==null&&!t){['archer','cannon','mage','barracks'].forEach((k,i)=>{b[i].style.display='';b[i].textContent=TT[k].n+' 🪙'+TT[k].c;b[i].disabled=gold<TT[k].c})}
 else if(t){b[0].style.display=b[1].style.display='';
  b[0].textContent=t.lvl<3?'⬆ อัปเกรด 🪙'+upCost(t):'เลเวลสูงสุด';b[0].disabled=t.lvl>=3||gold<upCost(t);
  b[1].textContent='ขาย 🪙'+Math.round(TT[t.type].c*.6*t.lvl);b[1].disabled=false}
 go.disabled=!(state==='play'&&!Q.length&&!E.length&&wave<10)}
function hit(p){
 const e=p.tg,ty=TT[p.tw.type],d=p.dm;
 if(ty.sp){const [ex,ey]=pos(e.d);E.forEach(o=>{const q=pos(o.d);if(Math.hypot(q[0]-ex,q[1]-ey)<ty.sp)o.hp-=d})}
 else e.hp-=d;
 if(ty.slow)e.sl=1.5}
function update(dt){
 if(state!=='play')return;
 if(Q.length){sT-=dt;if(sT<=0){const k=Q.shift(),a=ET[k];E.push({k,hp:a.hp*(1+wave*.12),mx:a.hp*(1+wave*.12),d:0,sl:0});sT=.9}}
 let hq=null,hd=0;
 if(H.dead>0){H.dead-=dt;if(H.dead<=0){H.hp=H.mx;H.d=H.td=520}}
 else{const df=H.td-H.d;H.d+=Math.sign(df)*Math.min(Math.abs(df),(120+H.u.s*25)*dt);H.cd-=dt;hq=pos(H.d);
  let b=null;E.forEach(e=>{const q=pos(e.d);if(Math.hypot(q[0]-hq[0],q[1]-hq[1])<34&&(!b||e.d>b.d))b=e});
  if(b&&H.cd<=0){H.cd=.7;b.hp-=16+wave*3+H.u.a*8}}
 const bl=[];T.forEach(t=>{if(t.type!=='barracks')return;t.sol.forEach(s=>{
  if(s.dead>0){s.dead-=dt;if(s.dead<=0)s.hp=s.mx;return}
  s.p=pos(Math.max(0,t.rd+s.o));s.cd-=dt;s.hit=0;bl.push(s)})});
 E.forEach(e=>{e.sl-=dt;let mv=1;const q=pos(e.d),ad=({gob:9,wolf:11,orc:16})[e.k];
  if(hq&&Math.hypot(q[0]-hq[0],q[1]-hq[1])<30){mv=0;hd+=ad}
  else{const s=bl.find(s=>Math.hypot(q[0]-s.p[0],q[1]-s.p[1])<30);if(s){mv=0;s.hit+=ad;if(s.cd<=0){s.cd=.8;e.hp-=5+s.t.lvl*4}}}
  e.d+=ET[e.k].sp*mv*(e.sl>0?.55:1)*dt});
 bl.forEach(s=>{s.hp-=s.hit*dt;if(s.hp<=0){s.hp=0;s.dead=8}});
 if(hq){if(hd>0)H.hp-=hd*dt;else H.hp=Math.min(H.mx,H.hp+8*dt);if(H.hp<=0){H.hp=0;H.dead=10;hSel=false}}
 E=E.filter(e=>{if(e.hp<=0){gold+=ET[e.k].rw;snd(780,.06,'square',.03);return false}
  if(e.d>=TOT){lives--;snd(110,.3,'sawtooth',.06);return false}return true});
 T.forEach(t=>{if(t.type==='barracks')return;t.cd-=dt;const ty=TT[t.type];
  if(t.cd>0)return;let b=null;
  E.forEach(e=>{const p=pos(e.d);if(Math.hypot(p[0]-t.x,p[1]-t.y)<=ty.r+t.lvl*8&&(!b||e.d>b.d))b=e});
  if(b){t.cd=ty.rt;PR.push({x:t.x,y:t.y,tg:b,tw:t,dm:dmgOf(t)});snd(({archer:880,cannon:140,mage:600})[t.type],.06,'square',.02)}});
 PR=PR.filter(p=>{if(p.tg.hp<=0)return false;const q=pos(p.tg.d),dx=q[0]-p.x,dy=q[1]-p.y,l=Math.hypot(dx,dy),s=420*dt;
  if(l<=s){hit(p);return false}p.x+=dx/l*s;p.y+=dy/l*s;return true});
 if(lives<=0){state='lose';snd(90,.8,'sawtooth',.08);say('พ่ายแพ้... แตะเพื่อเล่นใหม่')}
 else if(wave>=10&&!Q.length&&!E.length){state='win';snd(880,.6,'triangle',.08);say('ชัยชนะ! แตะเพื่อเล่นใหม่')}}
function drawOld(){
 g.fillStyle='#5f9b4a';g.fillRect(0,0,800,480);
 g.lineCap=g.lineJoin='round';g.strokeStyle='#b99a63';g.lineWidth=46;
 g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
 SL.forEach((s,i)=>{g.beginPath();g.arc(s[0],s[1],26,0,7);g.fillStyle=sel===i?'#ffe9a0':'#8d8d7a';g.fill();g.strokeStyle='#444';g.lineWidth=2;g.stroke()});
 T.forEach(t=>{const ty=TT[t.type];
  if(sel===t.s){g.beginPath();g.arc(t.x,t.y,ty.r+t.lvl*8,0,7);g.fillStyle='rgba(255,255,255,.18)';g.fill()}
  g.fillStyle=ty.col;g.fillRect(t.x-16,t.y-20,32,36);g.fillStyle='#fff';g.fillRect(t.x-6,t.y-28,12,10);
  g.fillStyle='#ffd400';for(let i=0;i<t.lvl;i++)g.fillRect(t.x-14+i*10,t.y+10,7,5)});
 E.forEach(e=>{const a=ET[e.k],p=pos(e.d);g.beginPath();g.arc(p[0],p[1],a.r,0,7);g.fillStyle=e.sl>0?'#6fa8dc':a.col;g.fill();
  g.fillStyle='#300';g.fillRect(p[0]-12,p[1]-a.r-8,24,4);g.fillStyle='#e33';g.fillRect(p[0]-12,p[1]-a.r-8,24*Math.max(0,e.hp/e.mx),4)});
 PR.forEach(p=>{g.beginPath();g.arc(p.x,p.y,4,0,7);g.fillStyle='#fff';g.fill()});
 g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,800,30);g.fillStyle='#fff';g.font='18px sans-serif';
 g.fillText('🪙 '+gold+'    ❤ '+lives+'    คลื่น '+wave+'/10',12,21);
 if(state!=='play'){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,170,800,140);g.fillStyle='#fff';g.font='bold 44px sans-serif';g.textAlign='center';
  g.fillText(state==='win'?'🏆 ชัยชนะ!':'💀 พ่ายแพ้',400,255);g.textAlign='left'}}
let AC,muted=false,mus=0,mi=0;
function snd(f,d,ty,v){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const o=AC.createOscillator(),gn=AC.createGain();o.type=ty||'square';o.frequency.value=f;gn.gain.value=v||.05;
 gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const NT=[262,330,392,330,294,349,440,349,262,330,392,523,392,330,294,196];
document.addEventListener('pointerdown',()=>{if(mus)return;snd(30,.01,'sine',.001);mus=setInterval(()=>{if(state==='play')snd(NT[mi++%16]/2,.25,'triangle',.03)},280)},{once:true});
document.getElementById('mu').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};

 R(0,0,800,36,'#111');g.fillStyle='#fff';g.font='16px "Press Start 2P",Sarabun,monospace';
 g.fillText('GOLD '+gold+'  HP '+lives+'  \u0e04\u0e25\u0e37\u0e48\u0e19 '+wave+'/10',12,24);g.fillText(H.dead>0?'HERO '+Math.ceil(H.dead):'HERO LV'+(1+H.u.a+H.u.h+H.u.s),560,24);
 if(state!=='play'){R(0,170,800,140,'rgba(0,0,0,.7)');g.fillStyle='#ffd400';g.font='32px "Press Start 2P",monospace';g.textAlign='center';
